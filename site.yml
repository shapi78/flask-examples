---
- name: Setup NGINX with Vault-fetched port
  hosts: localhost
  vars:
    vault_addr: "{{ lookup('env', 'vault_addr') }}"
    vault_token: "{{ lookup('env', 'vault_token') }}"
  tasks:

    - name: Get nginx_port from Vault
      uri:
        url: "{{ vault_addr }}/v1/secret-v2/data/nginx"
        method: GET
        headers:
          X-Vault-Token: "{{ vault_token }}"
        return_content: yes
      register: vault_response

    - name: Parse nginx_port from Vault response
      set_fact:
        nginx_port: "{{ (vault_response.json.data.data.nginx_port | default('80')) | int }}"

    - name: Template NGINX config
      template:
        src: nginx.conf.j2
        dest: /etc/nginx/nginx.conf
      become: yes

    - name: Restart NGINX
      service:
        name: nginx
        state: restarted
      become: yes

